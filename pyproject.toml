[project]
name = "sentinela-mercado"
version = "0.1.0"
description = "IA de trading autônomo (ações/ETFs EUA) — núcleo de decisão e risco"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
